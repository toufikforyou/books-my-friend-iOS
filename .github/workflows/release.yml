name: Release

# Push a tag like v1.2.0 to cut a release. The full test suite runs first and
# gates everything below it, so a release can only be built from a green tree.
#
# Signing secrets are optional. With them the job produces a signed .ipa; with-
# out them it still produces an unsigned .ipa and archive, so the pipeline is
# useful before an Apple Developer account is wired up. See .github/README.md.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release, e.g. v1.2.0'
        required: true
        type: string

permissions:
  contents: write

env:
  PROJECT: BooksMyFriend.xcodeproj
  SCHEME: BooksMyFriend
  APP_NAME: BooksMyFriend
  NSUnbufferedIO: "YES"

jobs:
  tests:
    # The same workflow CI runs — one definition of "the tests pass".
    uses: ./.github/workflows/tests.yml

  release:
    name: Archive and publish
    needs: tests
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up Xcode
        uses: ./.github/actions/setup-xcode

      - name: Resolve version
        id: version
        run: |
          set -euo pipefail
          tag="${{ inputs.tag || github.ref_name }}"
          version="${tag#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+(\.[0-9]+){0,2}$'; then
            echo "::error::Tag '${tag}' is not a version tag (expected vMAJOR.MINOR.PATCH)."
            exit 1
          fi
          # The run number is monotonic per repository, which is exactly what a
          # build number has to be for App Store Connect to accept an upload.
          echo "tag=$tag"                     >> "$GITHUB_OUTPUT"
          echo "version=$version"             >> "$GITHUB_OUTPUT"
          echo "build=${GITHUB_RUN_NUMBER}"   >> "$GITHUB_OUTPUT"
          echo "Releasing ${tag} as ${version} (${GITHUB_RUN_NUMBER})"

      - name: Detect signing assets
        id: signing
        env:
          CERTIFICATE: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          PROFILE: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          ASC_KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          set -euo pipefail
          # Secrets are deliberately turned into step outputs here: the secrets
          # context is not available in step-level `if:` conditions, so later
          # steps have to branch on something that is.
          if [ -n "$CERTIFICATE" ] && [ -n "$PROFILE" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No signing secrets set — building unsigned. \
            Add BUILD_CERTIFICATE_BASE64 and PROVISIONING_PROFILE_BASE64 to sign."
          fi

          if [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ]; then
            echo "appstore=true" >> "$GITHUB_OUTPUT"
          else
            echo "appstore=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Import certificate and provisioning profile
        if: steps.signing.outputs.available == 'true'
        id: profile
        env:
          CERTIFICATE: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROFILE: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          # Ephemeral password: the keychain lives only for this job.
          password="$(uuidgen)"

          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"

          printf '%s' "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" \
            -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          # Without this, codesign blocks on a UI prompt that will never appear.
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" > /dev/null
          security list-keychain -d user -s "$keychain" login.keychain-db

          profiles="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$profiles"
          printf '%s' "$PROFILE" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"

          name="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")"
          uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")"
          team="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$RUNNER_TEMP/profile.plist")"
          cp "$RUNNER_TEMP/profile.mobileprovision" "$profiles/$uuid.mobileprovision"

          # Derive the export method from the profile rather than asking for it
          # as a secret: exporting an app-store archive with a development
          # profile fails late and confusingly. An EXPORT_METHOD repository
          # variable overrides this if you need something specific.
          method="${{ vars.EXPORT_METHOD }}"
          if [ -z "$method" ]; then
            if /usr/libexec/PlistBuddy -c 'Print :Entitlements:get-task-allow' \
                 "$RUNNER_TEMP/profile.plist" 2>/dev/null | grep -q true; then
              method="development"
            elif /usr/libexec/PlistBuddy -c 'Print :ProvisionedDevices' \
                   "$RUNNER_TEMP/profile.plist" > /dev/null 2>&1; then
              method="ad-hoc"
            else
              method="app-store"
            fi
          fi

          echo "name=$name"     >> "$GITHUB_OUTPUT"
          echo "team=$team"     >> "$GITHUB_OUTPUT"
          echo "method=$method" >> "$GITHUB_OUTPUT"
          echo "keychain=$keychain" >> "$GITHUB_OUTPUT"
          echo "Profile '$name' (team $team) → export method $method"

      - name: Archive (signed)
        if: steps.signing.outputs.available == 'true'
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "build/$APP_NAME.xcarchive" \
            MARKETING_VERSION="${{ steps.version.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ steps.version.outputs.build }}" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="${{ steps.profile.outputs.team }}" \
            PROVISIONING_PROFILE_SPECIFIER="${{ steps.profile.outputs.name }}"

      - name: Export .ipa
        if: steps.signing.outputs.available == 'true'
        run: |
          set -euo pipefail
          # Read the identifier off the archive rather than hardcoding it, so a
          # bundle ID change never silently breaks the export mapping.
          bundle_id="$(/usr/libexec/PlistBuddy \
            -c 'Print :ApplicationProperties:CFBundleIdentifier' \
            "build/$APP_NAME.xcarchive/Info.plist")"
          echo "exporting $bundle_id"

          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>${{ steps.profile.outputs.method }}</string>
            <key>teamID</key><string>${{ steps.profile.outputs.team }}</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${bundle_id}</key>
              <string>${{ steps.profile.outputs.name }}</string>
            </dict>
            <key>stripSwiftSymbols</key><true/>
            <key>uploadSymbols</key><true/>
            <key>compileBitcode</key><false/>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "build/$APP_NAME.xcarchive" \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export

      - name: Archive and package (unsigned)
        if: steps.signing.outputs.available == 'false'
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "build/$APP_NAME.xcarchive" \
            MARKETING_VERSION="${{ steps.version.outputs.version }}" \
            CURRENT_PROJECT_VERSION="${{ steps.version.outputs.build }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

          # An unsigned .ipa is just the Payload layout zipped. It cannot be
          # installed on a device as-is, but it is what re-signing tools take.
          mkdir -p build/export/Payload
          cp -R "build/$APP_NAME.xcarchive/Products/Applications/$APP_NAME.app" \
                build/export/Payload/
          (cd build/export && zip -qry "$APP_NAME-unsigned.ipa" Payload && rm -rf Payload)

      - name: Collect artifacts
        id: artifacts
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          build="${{ steps.version.outputs.build }}"
          dist="$PWD/dist"
          mkdir -p "$dist"

          ipa="$(find build/export -maxdepth 1 -name '*.ipa' | head -1)"
          if [ -z "$ipa" ]; then
            echo "::error::No .ipa was produced."
            exit 1
          fi
          suffix=""
          [ "${{ steps.signing.outputs.available }}" = "false" ] && suffix="-unsigned"
          cp "$ipa" "$dist/${APP_NAME}-${version}-${build}${suffix}.ipa"

          # dSYMs are what makes a crash report from a released build readable,
          # and they are only obtainable from the archive that produced it.
          if [ -d "build/$APP_NAME.xcarchive/dSYMs" ]; then
            (cd "build/$APP_NAME.xcarchive" \
              && zip -qry "$dist/${APP_NAME}-${version}-${build}-dSYMs.zip" dSYMs)
          fi

          (cd dist && shasum -a 256 * > SHA256SUMS.txt)
          ls -lh dist
          echo "dir=dist" >> "$GITHUB_OUTPUT"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ steps.version.outputs.version }}
          path: dist/*
          retention-days: 90

      - name: Publish to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          notes="Build ${{ steps.version.outputs.build }} · tests passed on this commit."
          if [ "${{ steps.signing.outputs.available }}" = "false" ]; then
            notes="$notes

          > This build is **unsigned** — no signing secrets are configured on the repository."
          fi

          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
            gh release edit "$tag" --notes "$notes"
          else
            gh release create "$tag" dist/* \
              --title "Books My Friend $tag" \
              --generate-notes \
              --notes "$notes"
          fi

      - name: Upload to App Store Connect
        # Only when an API key is configured and the archive was actually signed
        # for the store; anything else would be rejected on arrival.
        if: >-
          steps.signing.outputs.available == 'true' &&
          steps.signing.outputs.appstore == 'true' &&
          steps.profile.outputs.method == 'app-store'
        env:
          KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8
          ipa="$(find dist -name '*.ipa' | head -1)"
          xcrun altool --upload-app -f "$ipa" -t ios \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"

      - name: Clean up the keychain
        if: always() && steps.signing.outputs.available == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/profile.plist" \
                "$RUNNER_TEMP/profile.mobileprovision" || true
